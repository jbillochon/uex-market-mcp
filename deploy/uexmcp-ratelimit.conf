# Rate-limit zone for uex.cavalera.news (MCP connector). Included in the http
# block through /etc/nginx/conf.d/*.conf. Zone names are global: "uexmcp" is
# used nowhere else. Claude.ai connectors share a few egress IPs, hence a
# generous per-IP rate; the real cap on UEX traffic is in the application.
limit_req_zone $binary_remote_addr zone=uexmcp:10m rate=120r/m;
